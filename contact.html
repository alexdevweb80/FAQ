<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - alexdev</title>
    <!-- On réutilise le style global de la FAQ -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <section class="faq contact-section">
        <a href="index.html" class="back-link">← Retour à la FAQ</a>
        
        <div class="contact-header">
            <img src="logo.svg" alt="alexdev logo" class="logo">
            <h1>alexdev</h1>
        </div>
        
        <p>Une question, un projet ? Contactez-nous dès maintenant !</p>

        <form id="contact-form" class="contact-form">
            <div class="form-group">
                <label for="name">Nom</label>
                <input type="text" id="name" name="name" required placeholder="Votre nom complet" autocomplete="name">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Votre adresse email" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required placeholder="Comment pouvons-nous vous aider ?"></textarea>
            </div>

            <button type="submit" id="submit-btn" class="custom-button">Envoyer</button>
            <div id="form-status" class="form-status"></div>
        </form>
    </section>

    <!-- Inclusion du JS compilé depuis le TS -->
    <script src="contact.js"></script>
</body>
</html>
